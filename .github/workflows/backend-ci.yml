name: Backend CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_DB: ddu_ci
          POSTGRES_USER: ddu_test
          POSTGRES_PASSWORD: ddu_test_password_only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ddu_test -d ddu_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: ddu_ci
      DB_USER: ddu_test
      DB_PASSWORD: ddu_test_password_only
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - name: Install backend with test dependencies
        run: uv sync --frozen --project backend --extra dev
      - name: Validate authored scenario manifests
        run: uv run --locked --project backend python -m app.scenarios.cli validate-all scenarios
      - name: Verify authored scenario bundle pins
        run: uv run --locked --project backend python -m app.scenarios.cli verify-bundle-pins scenarios
      - name: Ruff
        run: |
          uv run --locked --project backend ruff check backend
          uv run --locked --project backend ruff check --select E4,E7,E9,F,I scripts/m2_fake_smoke.py backend/tests
      - name: Unit and contract tests
        run: uv run --locked --project backend pytest -q backend/tests -k "not heartbeat_insert_and_update"
      - name: Alembic upgrade
        working-directory: backend
        run: uv run --locked --project . alembic upgrade head
      - name: Integration tests against PostgreSQL
        working-directory: backend
        env:
          DDU_TEST_DB: "1"
        run: |
          uv run --locked --project . pytest -q tests/test_integration.py
          uv run --locked --project . pytest -q tests/test_m2_integration.py
          uv run --locked --project . pytest -q tests/test_migration_preservation.py
          uv run --locked --project . pytest -q tests/test_scenario_runtime.py
          uv run --locked --project . pytest -q tests/test_scenario_repository.py
          uv run --locked --project . pytest -q tests/test_scenario_cli_db.py
          uv run --locked --project . pytest -q tests/test_scenario_api.py
      - name: Validate backend Compose project
        run: |
          cp deployment/backend/.env.example deployment/backend/.env
          docker compose -f deployment/backend/compose.yaml --env-file deployment/backend/.env config --quiet
      - name: Build and boot Docker backend without inference
        run: |
          set -eu
          docker network create ddu_inference_bus
          echo "COMPOSE_BOOT_ATTEMPTED=true" >> "$GITHUB_ENV"
          docker compose -f deployment/backend/compose.yaml --env-file deployment/backend/.env up -d --build
          for i in $(seq 1 45); do
            if curl --max-time 2 -fsS http://127.0.0.1:8000/readyz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
          for i in $(seq 1 20); do
            if curl --max-time 3 -fsS http://127.0.0.1:8000/api/v1/status | python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(not (d.get("worker")=="running" and d.get("inference")=="degraded"))'; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/status | python -c 'import json,sys; d=json.load(sys.stdin); assert d["database"] and d["worker"]=="running" and d["inference"]=="degraded", d; print(d)'
          uv run --locked --project backend python scripts/m2_fake_smoke.py --base-url http://127.0.0.1:8000
      - name: Print container logs on failure
        if: failure()
        run: |
          if [[ "${COMPOSE_BOOT_ATTEMPTED:-false}" != "true" || ! -f deployment/backend/.env ]]; then
            echo "Compose not started; no container logs available"
            exit 0
          fi
          docker compose -f deployment/backend/compose.yaml --env-file deployment/backend/.env ps || true
          docker compose -f deployment/backend/compose.yaml --env-file deployment/backend/.env logs --no-color --tail=120 || true
