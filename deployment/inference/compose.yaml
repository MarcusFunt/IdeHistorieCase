name: ddu-inference
services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    command:
      - --model
      - /models/${LLM_GGUF_FILE}
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --ctx-size
      - ${LLM_CTX_SIZE:-4096}
      - --n-gpu-layers
      - ${LLM_GPU_LAYERS:-99}
      - --parallel
      - ${LLM_PARALLEL:-1}
      - --alias
      - ddu-narrator
    volumes:
      - ${LLM_MODELS_DIR:?Set LLM_MODELS_DIR}:/models:ro
    networks:
      inference_bus:
        aliases: [ddu-llm]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  inference_bus:
    external: true
    name: ddu_inference_bus
