name: ddu-backend

x-backend-environment: &backend-environment
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-ddu_game}
  DB_USER: ${POSTGRES_USER:-ddu_app}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/backend/.env}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://ddu-llm:8080}
  LLM_MODEL_ALIAS: ${LLM_MODEL_ALIAS:-ddu-narrator}
  LLM_COMPLETION_TIMEOUT_SECONDS: ${LLM_COMPLETION_TIMEOUT_SECONDS:-240}
  LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING-}
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-10}
  WORKER_STALE_SECONDS: ${WORKER_STALE_SECONDS:-45}
  TURN_LEASE_SECONDS: ${TURN_LEASE_SECONDS:-60}
  TURN_LEASE_RENEW_INTERVAL_SECONDS: ${TURN_LEASE_RENEW_INTERVAL_SECONDS:-15}
  TURN_CONTEXT_TIMEOUT_SECONDS: ${TURN_CONTEXT_TIMEOUT_SECONDS:-30}
  TURN_INFERENCE_TIMEOUT_SECONDS: ${TURN_INFERENCE_TIMEOUT_SECONDS:-220}
  TURN_TOTAL_TIMEOUT_SECONDS: ${TURN_TOTAL_TIMEOUT_SECONDS:-1380}
  RAG_EMBED_BASE_URL: ${RAG_EMBED_BASE_URL:-http://ddu-embed:8080}
  RAG_EMBED_MODEL_ID: ${RAG_EMBED_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B@97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3}
  RAG_EMBED_TIMEOUT_SECONDS: ${RAG_EMBED_TIMEOUT_SECONDS:-15}
  RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-false}
  RAG_RERANK_BASE_URL: ${RAG_RERANK_BASE_URL-}
  RAG_RERANK_MODEL_ID: ${RAG_RERANK_MODEL_ID:-Alibaba-NLP/gte-multilingual-reranker-base@8215cf04918ba6f7b6a62bb44238ce2953d8831c+code@40ced75c3017eb27626c9d4ea981bde21a2662f4}
  RAG_RERANK_TIMEOUT_SECONDS: ${RAG_RERANK_TIMEOUT_SECONDS:-20}
  RAG_CANDIDATE_LIMIT: ${RAG_CANDIDATE_LIMIT:-20}
  RAG_RRF_K: ${RAG_RRF_K:-60}
  RAG_MIN_LEXICAL_SCORE: ${RAG_MIN_LEXICAL_SCORE:-0.03}
  RAG_MIN_DENSE_SIMILARITY: ${RAG_MIN_DENSE_SIMILARITY:-0.60}
  RAG_MIN_RERANK_SCORE: ${RAG_MIN_RERANK_SCORE:-0.20}

x-backend-build: &backend-build
  context: ../../backend

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ddu_game}
      POSTGRES_USER: ${POSTGRES_USER:-ddu_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/backend/.env}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    restart: "no"

  api:
    build: *backend-build
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      <<: *backend-environment
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-ddu_game}
      DB_USER: ${POSTGRES_USER:-ddu_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/backend/.env}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ddu-llm:8080}
      LLM_MODEL_ALIAS: ${LLM_MODEL_ALIAS:-ddu-narrator}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING-}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-10}
      WORKER_STALE_SECONDS: ${WORKER_STALE_SECONDS:-45}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ../../scenarios:/srv/scenarios:ro
    networks: [data, ingress, inference_bus]

  turn-worker:
    build: *backend-build
    command: ["python", "-m", "app.workers.main"]
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data, inference_bus]

volumes:
  pgdata:

networks:
  data:
    internal: true
  ingress: {}
  inference_bus:
    external: true
    name: ddu_inference_bus
